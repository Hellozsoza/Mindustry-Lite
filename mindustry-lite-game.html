<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Mindustry-Lite HTML</title><style>*{margin:0;padding:0}body{width:100vw;height:100vh;background:#1a1a2e;color:#eee;font-family:Arial;overflow:hidden}canvas{display:block;background:#0f3460}#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}#resources{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.8);padding:15px;border-radius:5px;font-size:14px;pointer-events:auto;border:1px solid #2a9d8f}#waveInfo{position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.8);padding:15px;border-radius:5px;font-size:14px;pointer-events:auto;border:1px solid #e76f51}#buildingPanel{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,0.8);padding:15px;border-radius:5px;pointer-events:auto;border:1px solid #2a9d8f}#buildingPanel button{background:#2a9d8f;color:#fff;border:none;padding:8px 12px;margin:3px;cursor:pointer;border-radius:3px;font-size:12px;width:85px}#buildingPanel button.selected{background:#e76f51}#gameUI{position:absolute;bottom:10px;left:10px;pointer-events:auto}#gameUI button{background:#e76f51;color:#fff;border:none;padding:10px 20px;cursor:pointer;border-radius:3px;font-weight:bold}.stat-label{color:#2a9d8f;font-weight:bold}.stat-value{color:#f4a261;font-weight:bold}div>div{margin:5px 0}</style></head><body><canvas id="gameCanvas"></canvas><div id="ui"><div id="resources"><div><span class="stat-label">Copper:</span> <span id="copper" class="stat-value">50</span></div><div><span class="stat-label">Lead:</span> <span id="lead" class="stat-value">20</span></div><div><span class="stat-label">Coal:</span> <span id="coal" class="stat-value">10</span></div><div><span class="stat-label">Health:</span> <span id="health" class="stat-value">100</span></div></div><div id="waveInfo"><div><span class="stat-label">Wave:</span> <span id="wave" class="stat-value">1</span></div><div><span class="stat-label">Enemies:</span> <span id="enemies" class="stat-value">0</span></div><div><span class="stat-label">Score:</span> <span id="score" class="stat-value">0</span></div></div><div id="gameUI"><button onclick="game.toggleGameState()"><span id="pauseText">Pause (P)</span></button></div><div id="buildingPanel"><div style="font-weight:bold;margin-bottom:10px">Buildings</div><button onclick="game.selectBuilding('drill')">Drill</button><button onclick="game.selectBuilding('turret')">Turret</button><button onclick="game.selectBuilding('storage')">Storage</button><button onclick="game.selectBuilding('conduit')">Conduit</button><button onclick="game.clearSelection()">Clear</button></div></div><script>const canvas=document.getElementById('gameCanvas');const ctx=canvas.getContext('2d');canvas.width=window.innerWidth;canvas.height=window.innerHeight;const TILE_SIZE=32;const GRID_WIDTH=Math.ceil(canvas.width/TILE_SIZE);const GRID_HEIGHT=Math.ceil(canvas.height/TILE_SIZE);class Tile{constructor(x,y){this.x=x;this.y=y;this.building=null;}draw(){ctx.fillStyle=this.building?'#2a9d8f':'#0f3460';ctx.fillRect(this.x*TILE_SIZE,this.y*TILE_SIZE,TILE_SIZE,TILE_SIZE);ctx.strokeStyle='#1a3a4a';ctx.lineWidth=1;ctx.strokeRect(this.x*TILE_SIZE,this.y*TILE_SIZE,TILE_SIZE,TILE_SIZE);if(this.building)this.building.draw(ctx,this.x*TILE_SIZE,this.y*TILE_SIZE);}}class Building{constructor(type,x,y){this.type=type;this.x=x;this.y=y;this.health=100;this.color=type==='drill'?'#c9a961':type==='turret'?'#e76f51':type==='storage'?'#4a90e2':'#2a9d8f';}draw(ctx,px,py){ctx.fillStyle=this.color;ctx.fillRect(px+4,py+4,TILE_SIZE-8,TILE_SIZE-8);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(px+4,py+4,TILE_SIZE-8,TILE_SIZE-8);}}class Enemy{constructor(x,y){this.x=x;this.y=y;this.vx=(Math.random()-0.5)*2;this.vy=(Math.random()-0.5)*2;this.radius=6;this.health=15;}draw(){ctx.fillStyle='#ff6b6b';ctx.beginPath();ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ff3333';ctx.lineWidth=2;ctx.stroke();}}class Game{constructor(){this.tiles=[];this.buildings=[];this.enemies=[];this.resources={copper:50,lead:20,coal:10,gold:0};this.health=100;this.wave=1;this.score=0;this.isPaused=false;this.selectedBuilding=null;this.waveCounter=0;this.initGrid();this.gameLoop();}initGrid(){for(let y=0;y<GRID_HEIGHT;y++){for(let x=0;x<GRID_WIDTH;x++){this.tiles.push(new Tile(x,y));}}}getTile(x,y){if(x<0||x>=GRID_WIDTH||y<0||y>=GRID_HEIGHT)return null;return this.tiles[y*GRID_WIDTH+x];}gameLoop(){this.update();this.draw();requestAnimationFrame(()=>this.gameLoop());}update(){if(this.isPaused)return;this.waveCounter++;if(this.waveCounter>180&&this.enemies.length===0){this.wave++;this.waveCounter=0;for(let i=0;i<3+this.wave;i++){this.enemies.push(new Enemy(Math.random()*canvas.width,Math.random()*canvas.height));}}this.enemies.forEach((e,idx)=>{e.x+=e.vx;e.y+=e.vy;if(e.x<0||e.x>canvas.width||e.y<0||e.y>canvas.height){this.enemies.splice(idx,1);this.health=Math.max(0,this.health-5);this.score+=10;}});this.buildings.forEach(b=>{if(b.type==='drill'){this.resources.copper=Math.min(999,this.resources.copper+0.1);}});if(Math.random()<0.003){let attemptX=Math.floor(Math.random()*canvas.width);let attemptY=Math.floor(Math.random()*canvas.height);this.enemies.push(new Enemy(attemptX,attemptY));}this.updateUI();}updateUI(){document.getElementById('copper').innerText=Math.floor(this.resources.copper);document.getElementById('lead').innerText=Math.floor(this.resources.lead);document.getElementById('coal').innerText=Math.floor(this.resources.coal);document.getElementById('health').innerText=this.health;document.getElementById('wave').innerText=this.wave;document.getElementById('enemies').innerText=this.enemies.length;document.getElementById('score').innerText=this.score;if(this.health<=0){alert('Game Over! Score: '+this.score);location.reload();}}draw(){ctx.fillStyle='#0f3460';ctx.fillRect(0,0,canvas.width,canvas.height);this.tiles.forEach(t=>t.draw());this.enemies.forEach(e=>e.draw());}selectBuilding(type){this.selectedBuilding=type;const buttons=document.querySelectorAll('#buildingPanel button');buttons.forEach(b=>b.classList.remove('selected'));event.target.closest('button').classList.add('selected');}clearSelection(){this.selectedBuilding=null;const buttons=document.querySelectorAll('#buildingPanel button');buttons.forEach(b=>b.classList.remove('selected'));}toggleGameState(){this.isPaused=!this.isPaused;document.getElementById('pauseText').innerText=this.isPaused?'Resume (P)':'Pause (P)';}}const game=new Game();canvas.addEventListener('click',(e)=>{if(game.selectedBuilding){const x=Math.floor(e.clientX/TILE_SIZE);const y=Math.floor(e.clientY/TILE_SIZE);const tile=game.getTile(x,y);if(tile&&!tile.building){tile.building=new Building(game.selectedBuilding,x,y);game.buildings.push(tile.building);if(game.selectedBuilding==='drill'){game.resources.copper-=5;}}}});document.addEventListener('keydown',(e)=>{if(e.key==='p'||e.key==='P')game.toggleGameState();if(e.key==='c'||e.key==='C')game.selectBuilding('drill');if(e.key==='t'||e.key==='T')game.selectBuilding('turret');if(e.key==='s'||e.key==='S')game.selectBuilding('storage');if(e.key==='d'||e.key==='D')game.selectBuilding('conduit');if(e.key==='e'||e.key==='E')game.clearSelection();});</script></body></html>
